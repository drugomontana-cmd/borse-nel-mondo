name: Aggiorna dati di mercato

on:
  schedule:
    # Dal lunedì al venerdì alle 17:30 UTC (18:30 in Italia d'inverno),
    # dopo la chiusura di tutte le borse del sito
    - cron: "30 17 * * 1-5"
  workflow_dispatch: {}   # permette di avviarlo a mano dalla scheda "Actions"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa librerie
        run: pip install -r requirements.txt

      - name: Scarica i dati
        run: python scripts/update_data.py

      - name: Salva i dati aggiornati
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || git commit -m "Dati di mercato aggiornati"
          git push
